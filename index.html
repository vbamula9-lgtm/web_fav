<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #1e0533, #380e54, #521873);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
    padding: 20px;
    color: #ffffff;
}

h1 {
    font-size: 2.5rem;
    margin-bottom: 1.5rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(216, 180, 254, 0.4);
    color: #f3e8ff;
    text-align: center;
}

a {
    display: block;
    width: 100%;
    max-width: 320px;
    padding: 14px 24px;
    text-align: center;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 600;
    text-transform: capitalize;
    color: #ffffff;
    background: rgba(147, 51, 234, 0.25);
    border: 1px solid rgba(216, 180, 254, 0.3);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

a:hover {
    background: rgba(168, 85, 247, 0.6);
    border-color: #e9d5ff;
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 12px 20px rgba(168, 85, 247, 0.4);
}

a:active {
    transform: translateY(-1px);
}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAV WEB PAGES BOOKMARKED</title>
</head>
<body>
    <h1>FAV WEBS </h1>
    <a href="https://google.com" target="_blank">google</a>
    <a href="https://facebook.com" target="_blank">facebook</a>
    <a href="https://instagram.com" target="_blank">instagram</a>
    <a href="https://telegram.com" target="_blank">telegram</a>
    <a href="https://leetcode.com" target="_blank">leetcode</a>
</body>
</html>
